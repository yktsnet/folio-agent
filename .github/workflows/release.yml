name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }

      - name: Verify tag matches package versions
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          handler_version=$(node -p "require('./packages/handler/package.json').version")
          widget_version=$(node -p "require('./packages/widget/package.json').version")
          if [ "$tag_version" != "$handler_version" ] || [ "$tag_version" != "$widget_version" ]; then
            echo "::error::tag v$tag_version does not match package versions (handler=$handler_version, widget=$widget_version)"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      # bin symlink の回帰テストはビルド成果物を spawn するため、test より先に build する
      - run: npm run build
      - run: npm test

      - name: Publish (Trusted Publishing / OIDC, npm >= 11.5.1 required)
        run: npm publish --provenance -w @folio-agent/handler -w @folio-agent/widget

      # 手で作った Release がある場合に二重作成で落ちないよう、無いときだけ作る
      - name: Create GitHub Release
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest
        env:
          GH_TOKEN: ${{ github.token }}
